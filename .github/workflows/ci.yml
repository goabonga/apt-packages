name: ci

on:
  pull_request:
    branches: [main, "issue-*"]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # `multicz validate` reads the root config, merges every component file
  # selected by [[component.path]] and checks the result: names, depends_on,
  # tag prefixes, the debian/changelog each component takes its version from,
  # and drift against the persisted state.
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: "3.12"
      - name: Validate the multicz configuration
        run: uv tool run --from "multicz>=1.10.0" multicz validate --strict
