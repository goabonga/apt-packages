name: New package
description: Propose a package this repository should ship
labels: ["new-package"]
body:
  - type: markdown
    attributes:
      value: |
        A proposal is most likely to land if it is something that is not in
        the Debian or Ubuntu archives, or that is there but outdated or broken.

  - type: input
    id: source
    attributes:
      label: Proposed source package name
      description: >
        Lowercase letters, digits and + - . only, at least two characters,
        starting with a letter or a digit. This becomes the directory and the
        commit scope - the same string.
      placeholder: example-pkg
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What it packages, and why it belongs here
    validations:
      required: true

  - type: input
    id: existing
    attributes:
      label: Existing Debian or Ubuntu package, if any
      description: Link it, and say why it is not sufficient (missing, outdated, broken).

  - type: input
    id: upstream
    attributes:
      label: Upstream source
      placeholder: https://github.com/...
